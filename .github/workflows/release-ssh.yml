---
name: Release (SSH trigger)
run-name: 'SSH release: ${{ github.ref_name }}'

on:
  push:
    branches:
      - 'release-trigger/v*'

permissions:
  actions: write
  contents: read

concurrency:
  group: release-ssh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch release for the existing tag
        uses: actions/github-script@v8
        with:
          script: |
            const prefix = 'refs/heads/release-trigger/';
            if (!context.ref.startsWith(prefix)) {
              throw new Error('Expected a release-trigger branch');
            }
            const tag = context.ref.slice(prefix.length);
            if (!/^v\d+\.\d+\.\d+$/.test(tag)) {
              throw new Error('Release trigger must name vMAJOR.MINOR.PATCH');
            }
            const ref = context.payload.repository.default_branch;
            if (!ref) {
              throw new Error('Repository default branch is required');
            }
            const { owner, repo } = context.repo;
            await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
            await github.rest.actions.createWorkflowDispatch({
              owner, repo, workflow_id: 'release.yml', ref,
              inputs: { tag, phase: 'release' },
            });
            core.notice(`Requested ${tag} release using the workflow on ${ref}`);
