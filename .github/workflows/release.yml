---
# yamllint disable rule:line-length
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to rebuild and publish
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: akmux
  BACKEND_BIN_NAME: akmux-sessiond
  PRODUCT_NAME: AkironMux
  PNPM_VERSION: 11
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/session-ui/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable

      - name: Build embedded WebUI
        working-directory: web/session-ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install packaging tools
        run: cargo install cargo-deb cargo-generate-rpm

      - name: Build release binaries
        run: cargo build --release

      - name: Package tar.gz
        run: |
          VERSION="${RELEASE_TAG#v}"
          mkdir -p dist
          cp target/release/${{ env.BIN_NAME }} dist/
          cp target/release/${{ env.BACKEND_BIN_NAME }} dist/
          cp README.md LICENSE dist/
          mkdir -p release-assets
          tar -C dist -czf "release-assets/${PRODUCT_NAME}-${VERSION}-linux-x86_64-cli.tar.gz" .

      - name: Package deb
        run: cargo deb --no-build

      - name: Package rpm
        run: cargo generate-rpm

      - name: Normalize Linux CLI package names
        run: |
          VERSION="${RELEASE_TAG#v}"
          cp target/debian/akiron-mux_*.deb \
            "release-assets/${PRODUCT_NAME}-${VERSION}-linux-x86_64-cli.deb"
          cp target/generate-rpm/akiron-mux-*.rpm \
            "release-assets/${PRODUCT_NAME}-${VERSION}-linux-x86_64-cli.rpm"

      - name: Upload Linux CLI packages
        uses: actions/upload-artifact@v4
        with:
          name: AkironMux-linux-x86_64-cli
          path: release-assets/*
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/session-ui/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable

      - name: Build embedded WebUI
        working-directory: web/session-ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build release binaries
        run: cargo build --release

      - name: Package tar.gz
        run: |
          VERSION="${RELEASE_TAG#v}"
          mkdir -p dist
          cp target/release/${{ env.BIN_NAME }} dist/
          cp target/release/${{ env.BACKEND_BIN_NAME }} dist/
          cp README.md LICENSE dist/
          mkdir -p release-assets
          tar -C dist -czf "release-assets/${PRODUCT_NAME}-${VERSION}-macos-arm64-cli.tar.gz" .

      - name: Upload macOS CLI package
        uses: actions/upload-artifact@v4
        with:
          name: AkironMux-macos-arm64-cli
          path: release-assets/*
          if-no-files-found: error

      - name: Update Homebrew formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${{ env.RELEASE_TAG }}"
          VERSION="${VERSION#v}"
          TARBALL="${PRODUCT_NAME}-${VERSION}-macos-arm64-cli.tar.gz"
          TARBALL_PATH="release-assets/${TARBALL}"
          SHA256=$(shasum -a 256 "$TARBALL_PATH" | cut -d ' ' -f 1)

          git clone "https://${HOMEBREW_TAP_TOKEN}@github.com/pomeluce/homebrew-ccswitch.git" homebrew-tap
          cd homebrew-tap

          mkdir -p Formula
          cat > Formula/akiron-mux.rb << 'RUBYEOF'
          class AkironMux < Formula
            desc "Unified Claude Code and Codex configuration manager"
            homepage "https://github.com/${{ github.repository }}"
            url "URL_PLACEHOLDER"
            sha256 "SHA_PLACEHOLDER"
            license "GPL-3.0"
            version "VERSION_PLACEHOLDER"

            def install
              bin.install "akmux"
              bin.install "akmux-sessiond"
            end

            test do
              system "#{bin}/akmux", "--version"
            end
          end
          RUBYEOF

          sed -i '' "s|URL_PLACEHOLDER|https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/${TARBALL}|" Formula/akiron-mux.rb
          sed -i '' "s|SHA_PLACEHOLDER|${SHA256}|" Formula/akiron-mux.rb
          sed -i '' "s|VERSION_PLACEHOLDER|${VERSION}|" Formula/akiron-mux.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/akiron-mux.rb
          git commit -m "chore: update AkironMux formula for ${{ env.RELEASE_TAG }}" || true
          git pull --rebase || true
          git push

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/session-ui/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable

      - name: Build embedded WebUI
        working-directory: web/session-ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build
        shell: bash

      - name: Build release binaries
        run: cargo build --release
        shell: bash

      - name: Package zip
        run: |
          $Version = $env:RELEASE_TAG -replace '^v', ''
          New-Item -ItemType Directory -Path dist -Force
          New-Item -ItemType Directory -Path release-assets -Force
          Copy-Item "target/release/${{ env.BIN_NAME }}.exe" -Destination dist/
          Copy-Item "target/release/${{ env.BACKEND_BIN_NAME }}.exe" -Destination dist/
          Copy-Item README.md -Destination dist/
          Copy-Item LICENSE -Destination dist/
          Compress-Archive -Path dist/* -DestinationPath "release-assets/$env:PRODUCT_NAME-$Version-windows-x86_64-cli.zip"
        shell: pwsh

      - name: Upload Windows CLI package
        uses: actions/upload-artifact@v4
        with:
          name: AkironMux-windows-x86_64-cli
          path: release-assets/*
          if-no-files-found: error

  gui-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      - name: Install GPUI system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake libayatana-appindicator3-dev libfontconfig1-dev \
            libgtk-3-dev libvulkan-dev libwayland-dev libx11-dev \
            libx11-xcb-dev libxdo-dev libxi-dev libxkbcommon-dev \
            libxkbcommon-x11-dev \
            mesa-vulkan-drivers patchelf pkg-config xvfb

      - name: Test GPUI desktop
        working-directory: clients/desktop
        run: cargo test --locked --workspace --all-targets

      - name: Build Linux desktop packages
        working-directory: clients/desktop
        run: |
          cargo install cargo-packager --version 0.11.8 --locked
          cargo packager --release --config packager.json --formats deb,appimage

      - name: Normalize Linux desktop package names
        run: |
          VERSION="${RELEASE_TAG#v}"
          mkdir -p release-assets
          cp clients/desktop/dist/*.deb \
            "release-assets/${PRODUCT_NAME}-${VERSION}-linux-x86_64-desktop.deb"
          cp clients/desktop/dist/*.AppImage \
            "release-assets/${PRODUCT_NAME}-${VERSION}-linux-x86_64-desktop.AppImage"

      - name: Upload Linux GUI packages
        uses: actions/upload-artifact@v4
        with:
          name: AkironMux-linux-x86_64-desktop
          path: release-assets/*
          if-no-files-found: error

  gui-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      - name: Test and package macOS desktop
        working-directory: clients/desktop
        run: |
          cargo test --locked --workspace --all-targets
          cargo install cargo-packager --version 0.11.8 --locked
          cargo packager --release --config packager.json --formats dmg

      - name: Normalize macOS desktop package name
        run: |
          VERSION="${RELEASE_TAG#v}"
          mkdir -p release-assets
          cp clients/desktop/dist/*.dmg \
            "release-assets/${PRODUCT_NAME}-${VERSION}-macos-arm64-desktop.dmg"

      - name: Upload macOS GUI package
        uses: actions/upload-artifact@v4
        with:
          name: AkironMux-macos-arm64-desktop
          path: release-assets/*
          if-no-files-found: error

  gui-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      - name: Test Windows credential integration
        working-directory: clients/desktop
        run: cargo test --locked --workspace --all-targets

      - name: Build Windows desktop installer
        working-directory: clients/desktop
        run: |
          cargo install cargo-packager --version 0.11.8 --locked
          cargo packager --release --config packager.json --formats nsis
        shell: bash

      - name: Normalize Windows desktop package name
        run: |
          $Version = $env:RELEASE_TAG -replace '^v', ''
          New-Item -ItemType Directory -Path release-assets -Force
          Copy-Item "clients/desktop/dist/*-setup.exe" -Destination "release-assets/$env:PRODUCT_NAME-$Version-windows-x86_64-desktop-setup.exe"
        shell: pwsh

      - name: Upload Windows GUI installer
        uses: actions/upload-artifact@v4
        with:
          name: AkironMux-windows-x86_64-desktop
          path: release-assets/*
          if-no-files-found: error

  gui-linux-arm64-check:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      - name: Install GPUI system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake libayatana-appindicator3-dev libfontconfig1-dev \
            libgtk-3-dev libvulkan-dev libwayland-dev libx11-dev \
            libx11-xcb-dev libxdo-dev libxi-dev libxkbcommon-dev \
            libxkbcommon-x11-dev \
            mesa-vulkan-drivers pkg-config

      - name: Compile GPUI desktop on Linux arm64
        working-directory: clients/desktop
        run: cargo check --locked --workspace --all-targets

  publish:
    needs: [linux, macos, windows, gui-linux, gui-macos, gui-windows, gui-linux-arm64-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test release publishing
        run: bash tests/release_publish_test.sh

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -maxdepth 2 -type f -print

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip all
        env:
          OUTPUT: CHANGELOG.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-release.sh "${{ env.RELEASE_TAG }}" CHANGELOG.md artifacts
