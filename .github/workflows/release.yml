---
# yamllint disable rule:line-length
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: akmux
  BACKEND_BIN_NAME: akmux-sessiond
  PRODUCT_NAME: AkironMux
  PNPM_VERSION: 11
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.tag.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test release tooling
        run: |
          node tests/release_workflow_test.mjs
          node tests/release_validation_test.mjs
          node tests/release_metadata_test.mjs
          bash tests/release_publish_test.sh
      - name: Validate release tag and source versions
        id: tag
        run: node scripts/validate-release.mjs

  linux:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/session-ui/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable

      - name: Build embedded WebUI
        working-directory: web/session-ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install packaging tools
        run: cargo install cargo-deb cargo-generate-rpm

      - name: Build release binaries
        run: cargo build --release

      - name: Package tar.gz
        run: |
          VERSION="${RELEASE_TAG#v}"
          mkdir -p dist
          cp target/release/${{ env.BIN_NAME }} dist/
          cp target/release/${{ env.BACKEND_BIN_NAME }} dist/
          cp README.md LICENSE dist/
          mkdir -p release-assets
          tar -C dist -czf "release-assets/${PRODUCT_NAME}-${VERSION}-linux-x86_64-cli.tar.gz" .

      - name: Package deb
        run: cargo deb --no-build

      - name: Package rpm
        run: cargo generate-rpm

      - name: Normalize Linux CLI package names
        run: |
          VERSION="${RELEASE_TAG#v}"
          cp target/debian/akiron-mux_*.deb \
            "release-assets/${PRODUCT_NAME}-${VERSION}-linux-x86_64-cli.deb"
          cp target/generate-rpm/akiron-mux-*.rpm \
            "release-assets/${PRODUCT_NAME}-${VERSION}-linux-x86_64-cli.rpm"

      - name: Upload Linux CLI packages
        uses: actions/upload-artifact@v4
        with:
          name: AkironMux-linux-x86_64-cli
          path: release-assets/*
          if-no-files-found: error

  macos:
    needs: validate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/session-ui/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable

      - name: Build embedded WebUI
        working-directory: web/session-ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build release binaries
        run: cargo build --release

      - name: Package tar.gz
        run: |
          VERSION="${RELEASE_TAG#v}"
          mkdir -p dist
          cp target/release/${{ env.BIN_NAME }} dist/
          cp target/release/${{ env.BACKEND_BIN_NAME }} dist/
          cp README.md LICENSE dist/
          mkdir -p release-assets
          tar -C dist -czf "release-assets/${PRODUCT_NAME}-${VERSION}-macos-arm64-cli.tar.gz" .

      - name: Upload macOS CLI package
        uses: actions/upload-artifact@v4
        with:
          name: AkironMux-macos-arm64-cli
          path: release-assets/*
          if-no-files-found: error

  windows:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/session-ui/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable

      - name: Build embedded WebUI
        working-directory: web/session-ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build
        shell: bash

      - name: Build release binaries
        run: cargo build --release
        shell: bash

      - name: Package zip
        run: |
          $Version = $env:RELEASE_TAG -replace '^v', ''
          New-Item -ItemType Directory -Path dist -Force
          New-Item -ItemType Directory -Path release-assets -Force
          Copy-Item "target/release/${{ env.BIN_NAME }}.exe" -Destination dist/
          Copy-Item "target/release/${{ env.BACKEND_BIN_NAME }}.exe" -Destination dist/
          Copy-Item README.md -Destination dist/
          Copy-Item LICENSE -Destination dist/
          Compress-Archive -Path dist/* -DestinationPath "release-assets/$env:PRODUCT_NAME-$Version-windows-x86_64-cli.zip"
        shell: pwsh

      - name: Upload Windows CLI package
        uses: actions/upload-artifact@v4
        with:
          name: AkironMux-windows-x86_64-cli
          path: release-assets/*
          if-no-files-found: error

  gui-linux:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/session-ui/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        working-directory: web/session-ui
        run: pnpm install --frozen-lockfile

      - name: Build Linux GUI packages
        uses: tauri-apps/tauri-action@v0
        env:
          CI: true
        with:
          projectPath: web/session-ui
          args: --bundles deb,appimage

      - name: Normalize Linux desktop package names
        run: |
          VERSION="${RELEASE_TAG#v}"
          mkdir -p release-assets
          cp web/session-ui/src-tauri/target/release/bundle/deb/*.deb \
            "release-assets/${PRODUCT_NAME}-${VERSION}-linux-x86_64-desktop.deb"
          cp web/session-ui/src-tauri/target/release/bundle/appimage/*.AppImage \
            "release-assets/${PRODUCT_NAME}-${VERSION}-linux-x86_64-desktop.AppImage"

      - name: Upload Linux GUI packages
        uses: actions/upload-artifact@v4
        with:
          name: AkironMux-linux-x86_64-desktop
          path: release-assets/*
          if-no-files-found: error

  gui-macos:
    needs: validate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/session-ui/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: web/session-ui
        run: pnpm install --frozen-lockfile

      - name: Build macOS GUI package
        uses: tauri-apps/tauri-action@v0
        env:
          CI: true
        with:
          projectPath: web/session-ui
          args: --bundles dmg

      - name: Normalize macOS desktop package name
        run: |
          VERSION="${RELEASE_TAG#v}"
          mkdir -p release-assets
          cp web/session-ui/src-tauri/target/release/bundle/dmg/*.dmg \
            "release-assets/${PRODUCT_NAME}-${VERSION}-macos-arm64-desktop.dmg"

      - name: Upload macOS GUI package
        uses: actions/upload-artifact@v4
        with:
          name: AkironMux-macos-arm64-desktop
          path: release-assets/*
          if-no-files-found: error

  gui-windows:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/session-ui/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: web/session-ui
        run: pnpm install --frozen-lockfile

      - name: Build frontend for desktop tests
        working-directory: web/session-ui
        run: pnpm build

      - name: Test Windows credential integration
        run: cargo test --manifest-path web/session-ui/src-tauri/Cargo.toml --lib backend::tests::windows_credential_adapter_round_trips_without_plaintext_profile_storage

      - name: Build Windows GUI installer
        uses: tauri-apps/tauri-action@v0
        env:
          CI: true
        with:
          projectPath: web/session-ui
          args: --bundles nsis

      - name: Normalize Windows desktop package name
        run: |
          $Version = $env:RELEASE_TAG -replace '^v', ''
          New-Item -ItemType Directory -Path release-assets -Force
          Copy-Item "web/session-ui/src-tauri/target/release/bundle/nsis/*-setup.exe" -Destination "release-assets/$env:PRODUCT_NAME-$Version-windows-x86_64-desktop-setup.exe"
        shell: pwsh

      - name: Upload Windows GUI installer
        uses: actions/upload-artifact@v4
        with:
          name: AkironMux-windows-x86_64-desktop
          path: release-assets/*
          if-no-files-found: error

  publish:
    needs: [validate, linux, macos, windows, gui-linux, gui-macos, gui-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.source_sha }}
      - uses: actions/checkout@v4
        with:
          path: release-tools
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate verified Nix release metadata
        run: node release-tools/scripts/release-metadata.mjs generate "$RELEASE_TAG" artifacts

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip all
        env:
          OUTPUT: CHANGELOG.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash release-tools/scripts/publish-release.sh "$RELEASE_TAG" CHANGELOG.md artifacts

  homebrew:
    needs: publish
    runs-on: ubuntu-latest
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Download macOS CLI archive
        if: env.HOMEBREW_TAP_TOKEN != ''
        uses: actions/download-artifact@v4
        with:
          name: AkironMux-macos-arm64-cli
          path: release-assets
      - name: Update Homebrew formula
        if: env.HOMEBREW_TAP_TOKEN != ''
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          TARBALL="${PRODUCT_NAME}-${VERSION}-macos-arm64-cli.tar.gz"
          TARBALL_PATH="release-assets/${TARBALL}"
          SHA256=$(sha256sum "$TARBALL_PATH" | cut -d ' ' -f 1)

          git clone "https://${HOMEBREW_TAP_TOKEN}@github.com/pomeluce/homebrew-ccswitch.git" homebrew-tap
          cd homebrew-tap

          mkdir -p Formula
          cat > Formula/akiron-mux.rb << 'RUBYEOF'
          class AkironMux < Formula
            desc "Unified Claude Code and Codex configuration manager"
            homepage "https://github.com/${{ github.repository }}"
            url "URL_PLACEHOLDER"
            sha256 "SHA_PLACEHOLDER"
            license "GPL-3.0"
            version "VERSION_PLACEHOLDER"

            def install
              bin.install "akmux"
              bin.install "akmux-sessiond"
            end

            test do
              system "#{bin}/akmux", "--version"
            end
          end
          RUBYEOF

          sed -i "s|URL_PLACEHOLDER|https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/${TARBALL}|" Formula/akiron-mux.rb
          sed -i "s|SHA_PLACEHOLDER|${SHA256}|" Formula/akiron-mux.rb
          sed -i "s|VERSION_PLACEHOLDER|${VERSION}|" Formula/akiron-mux.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/akiron-mux.rb
          git commit -m "chore: update AkironMux formula for $RELEASE_TAG" -m "Use the checksum of the immutable published macOS CLI archive." || true
          git pull --rebase
          git push

  sync-nix:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/checkout@v4
        with:
          path: release-tools
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download published Nix assets and metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets \
            --pattern "AkironMux-${VERSION}-linux-x86_64-cli.tar.gz" \
            --pattern "AkironMux-${VERSION}-linux-x86_64-desktop.deb" \
            --pattern "AkironMux-${VERSION}-nix-release-assets.nix"
      - name: Update Nix release metadata
        id: metadata
        run: node release-tools/scripts/release-metadata.mjs sync "$RELEASE_TAG" release-assets
      - name: Propose verified Nix release metadata
        if: steps.metadata.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: nix/release-assets.nix
          branch: release/nix-${{ env.RELEASE_TAG }}
          title: 'chore(nix): use release assets for ${{ env.RELEASE_TAG }}'
          commit-message: |
            chore(nix): use release assets for ${{ env.RELEASE_TAG }}

            Pin the filenames and SHA-256 checksums of the immutable published CLI and desktop assets.
          body: |
            Synchronize Nix installation with the published ${{ env.RELEASE_TAG }} binaries.
            The checksums were verified against files downloaded from the published Release.
            The source tag remains unchanged; merge this PR to update installations tracking the default branch.
