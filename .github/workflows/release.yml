---
# yamllint disable rule:line-length
name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: akmux
  BACKEND_BIN_NAME: akmux-sessiond
  PNPM_VERSION: 11

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/session-ui/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable

      - name: Build embedded WebUI
        working-directory: web/session-ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install packaging tools
        run: cargo install cargo-deb cargo-generate-rpm

      - name: Build release binaries
        run: cargo build --release

      - name: Package tar.gz
        run: |
          mkdir -p dist
          cp target/release/${{ env.BIN_NAME }} dist/
          cp target/release/${{ env.BACKEND_BIN_NAME }} dist/
          cp README.md LICENSE dist/
          tar -C dist -czf ${{ env.BIN_NAME }}_${{ github.ref_name }}_linux-x86_64.tar.gz .

      - name: Package deb
        run: cargo deb --no-build

      - name: Package rpm
        run: cargo generate-rpm

      - name: Upload Linux CLI packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-cli
          path: |
            ${{ env.BIN_NAME }}_${{ github.ref_name }}_linux-x86_64.tar.gz
            target/debian/akiron-mux_*.deb
            target/generate-rpm/akiron-mux-*.rpm

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/session-ui/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable

      - name: Build embedded WebUI
        working-directory: web/session-ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build release binaries
        run: cargo build --release

      - name: Package tar.gz
        run: |
          mkdir -p dist
          cp target/release/${{ env.BIN_NAME }} dist/
          cp target/release/${{ env.BACKEND_BIN_NAME }} dist/
          cp README.md LICENSE dist/
          tar -C dist -czf ${{ env.BIN_NAME }}_${{ github.ref_name }}_darwin-arm64.tar.gz .

      - name: Upload macOS CLI package
        uses: actions/upload-artifact@v4
        with:
          name: macos-cli
          path: ${{ env.BIN_NAME }}_${{ github.ref_name }}_darwin-arm64.tar.gz

      - name: Update Homebrew formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          TARBALL="${{ env.BIN_NAME }}_${{ github.ref_name }}_darwin-arm64.tar.gz"
          SHA256=$(shasum -a 256 "$TARBALL" | cut -d ' ' -f 1)

          git clone "https://${HOMEBREW_TAP_TOKEN}@github.com/pomeluce/homebrew-ccswitch.git" homebrew-tap
          cd homebrew-tap

          mkdir -p Formula
          cat > Formula/akiron-mux.rb << 'RUBYEOF'
          class AkironMux < Formula
            desc "Unified Claude Code and Codex configuration manager"
            homepage "https://github.com/${{ github.repository }}"
            url "URL_PLACEHOLDER"
            sha256 "SHA_PLACEHOLDER"
            license "GPL-3.0"
            version "VERSION_PLACEHOLDER"

            def install
              bin.install "akmux"
              bin.install "akmux-sessiond"
            end

            test do
              system "#{bin}/akmux", "--version"
            end
          end
          RUBYEOF

          sed -i '' "s|URL_PLACEHOLDER|https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${TARBALL}|" Formula/akiron-mux.rb
          sed -i '' "s|SHA_PLACEHOLDER|${SHA256}|" Formula/akiron-mux.rb
          sed -i '' "s|VERSION_PLACEHOLDER|${VERSION}|" Formula/akiron-mux.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/akiron-mux.rb
          git commit -m "chore: update AkironMux formula for ${{ github.ref_name }}" || true
          git pull --rebase || true
          git push

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/session-ui/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable

      - name: Build embedded WebUI
        working-directory: web/session-ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build
        shell: bash

      - name: Build release binaries
        run: cargo build --release
        shell: bash

      - name: Package zip
        run: |
          New-Item -ItemType Directory -Path dist -Force
          Copy-Item "target/release/${{ env.BIN_NAME }}.exe" -Destination dist/
          Copy-Item "target/release/${{ env.BACKEND_BIN_NAME }}.exe" -Destination dist/
          Copy-Item README.md -Destination dist/
          Copy-Item LICENSE -Destination dist/
          Compress-Archive -Path dist/* -DestinationPath "${{ env.BIN_NAME }}_${{ github.ref_name }}_windows-x86_64.zip"
        shell: pwsh

      - name: Upload Windows CLI package
        uses: actions/upload-artifact@v4
        with:
          name: windows-cli
          path: ${{ env.BIN_NAME }}_${{ github.ref_name }}_windows-x86_64.zip

  gui-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/session-ui/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        working-directory: web/session-ui
        run: pnpm install --frozen-lockfile

      - name: Build Linux GUI packages
        uses: tauri-apps/tauri-action@v0
        env:
          CI: true
        with:
          projectPath: web/session-ui
          args: --bundles deb,appimage

      - name: Upload Linux GUI packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-gui
          path: |
            web/session-ui/src-tauri/target/release/bundle/deb/*.deb
            web/session-ui/src-tauri/target/release/bundle/appimage/*.AppImage

  gui-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/session-ui/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: web/session-ui
        run: pnpm install --frozen-lockfile

      - name: Build macOS GUI package
        uses: tauri-apps/tauri-action@v0
        env:
          CI: true
        with:
          projectPath: web/session-ui
          args: --bundles dmg

      - name: Upload macOS GUI package
        uses: actions/upload-artifact@v4
        with:
          name: macos-gui
          path: web/session-ui/src-tauri/target/release/bundle/dmg/*.dmg

  gui-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/session-ui/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: web/session-ui
        run: pnpm install --frozen-lockfile

      - name: Build Windows GUI installer
        uses: tauri-apps/tauri-action@v0
        env:
          CI: true
        with:
          projectPath: web/session-ui
          args: --bundles nsis

      - name: Upload Windows GUI installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-gui
          path: web/session-ui/src-tauri/target/release/bundle/nsis/*-setup.exe

  publish:
    needs: [linux, macos, windows, gui-linux, gui-macos, gui-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -maxdepth 2 -type f -print

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip all
        env:
          OUTPUT: CHANGELOG.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file CHANGELOG.md \
            artifacts/*
