[package]
name = "akiron-mux"
version = "1.14.8"
edition = "2021"
rust-version = "1.80"
license = "GPL-3.0"

[[bin]]
name = "akmux"
path = "src/main.rs"

[[bin]]
name = "akmux-sessiond"
path = "src/bin/akmux-sessiond.rs"

[lib]
name = "ccswitch"
path = "src/lib.rs"

[dependencies]
# TUI
ratatui = "0.29"
crossterm = "0.28"

# CLI
clap = { version = "4.5", features = [ "derive" ] }
clap_complete = "4.5"
clap_mangen = "0.2"
dialoguer = "0.11"

# HTTP proxy
axum = { version = "0.7", features = [ "ws" ] }
reqwest = { version = "0.12", default-features = false, features = [ "stream", "json", "rustls-tls" ] }
tokio = { version = "1", features = [ "full" ] }
tokio-stream = "0.1"
bytes = "1"
futures-core = "0.3"
futures-util = "0.3"

# Managed terminal sessions
portable-pty = "0.9"

# Database
rusqlite = { version = "0.31", features = [ "bundled" ] }

# Standard directories (cross-platform)
dirs = "5"

# Config & serialization
toml = "0.8"
toml_edit = "0.22"
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"
base64 = "0.22"
hmac = "0.12"
rand = "0.8"
sha2 = "0.10"
subtle = "2"
url = "2"

# Dates/times
chrono = "0.4"

# Error handling
thiserror = "2"
anyhow = "1"


# Logging
tracing = "0.1"
tracing-subscriber = "0.3"
qrcode = { version = "0.14", default-features = false }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = [ "util" ] }

[package.metadata.deb]
name = "akiron-mux"
maintainer = "pomeluce <pomeluce+ccswitch@outlook.com>"
extended-description = "Unified Claude Code and Codex configuration manager"
section = "utils"
priority = "optional"
assets = [
  [
    "target/release/akmux",
    "usr/bin/akmux",
    "755",
  ],
  [
    "target/release/akmux-sessiond",
    "usr/bin/akmux-sessiond",
    "755",
  ],
  [
    "README.md",
    "usr/share/doc/akiron-mux/README.md",
    "644",
  ],
  [
    "LICENSE",
    "usr/share/doc/akiron-mux/LICENSE",
    "644",
  ],
  [
    "assets/akmux-proxy.service",
    "usr/lib/systemd/user/akmux-proxy.service",
    "644",
  ],
  [
    "assets/akmux-sessiond.service",
    "usr/lib/systemd/user/akmux-sessiond.service",
    "644",
  ],
]
depends = ""

[package.metadata.generate-rpm]
name = "akiron-mux"
license = "GPL-3.0"
summary = "Unified Claude Code and Codex configuration manager"
assets = [
  { source = "target/release/akmux", dest = "/usr/bin/akmux", mode = "755" },
  { source = "target/release/akmux-sessiond", dest = "/usr/bin/akmux-sessiond", mode = "755" },
  { source = "README.md", dest = "/usr/share/doc/akiron-mux/README.md", mode = "644" },
  { source = "LICENSE", dest = "/usr/share/doc/akiron-mux/LICENSE", mode = "644" },
  { source = "assets/akmux-proxy.service", dest = "/usr/lib/systemd/user/akmux-proxy.service", mode = "644" },
  { source = "assets/akmux-sessiond.service", dest = "/usr/lib/systemd/user/akmux-sessiond.service", mode = "644" },
]
