[workspace]
resolver = "2"
members = [ "crates/client-core", "crates/terminal", "crates/platform", "crates/app" ]

[workspace.package]
version = "1.15.1"
edition = "2024"
rust-version = "1.97.1"
license = "GPL-3.0"

[workspace.dependencies]
akmux-client-core = { path = "crates/client-core" }
akmux-desktop-platform = { path = "crates/platform" }
akmux-terminal = { path = "crates/terminal" }
alacritty_terminal = "=0.26.0"
anyhow = "1"
async-channel = "2"
async-trait = "0.1"
dirs = "6"
futures-util = "0.3"
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = [
  "font-kit",
  "runtime_shaders",
  "wayland",
  "x11",
] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "972a3ebfd01afca7da6d8b6f31c9a51288ea5565" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "972a3ebfd01afca7da6d8b6f31c9a51288ea5565" }
keyring = { version = "3", features = [ "apple-native", "windows-native", "sync-secret-service" ] }
parking_lot = "0.12"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = [ "json", "rustls-tls" ] }
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = [ "rt-multi-thread", "sync", "time", "macros", "net" ] }
tokio-tungstenite = { version = "0.27", features = [ "rustls-tls-webpki-roots" ] }
tracing = "0.1"
tracing-subscriber = "0.3"
tray-icon = "0.21"
url = "2"
zeroize = "1"
windows-sys = { version = "0.61", features = [ "Win32_Foundation", "Win32_Security_Credentials" ] }

[workspace.dependencies.gtk]
version = "0.18"
