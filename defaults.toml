version = 1

[[claude_providers]]
id = "deepseek"
name = "DeepSeek"
api_url = "https://api.deepseek.com/anthropic"
api_key = "env:DEEPSEEK_API_KEY"

[[claude_providers.profiles]]
id = "v4"
name = "V4"
opus = "deepseek-v4-pro[1m]"
sonnet = "deepseek-v4-pro[1m]"
haiku = "deepseek-v4-flash"
subagent = "deepseek-v4-flash"
default = true

# The official OpenAI Codex subscription provider is built in. This separate
# provider keeps API-key billing available when OPENAI_API_KEY is configured.
[[codex_providers]]
id = "openai-api"
name = "OpenAI API"
api_url = "https://api.openai.com/v1"
api_key = "env:OPENAI_API_KEY"
codex_catalog = "built-in"
