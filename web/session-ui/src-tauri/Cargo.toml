[package]
name = "akiron-mux"
version = "1.14.8"
description = "Unified Claude Code and Codex session workspace"
authors = ["AkironMux contributors"]
edition = "2021"
rust-version = "1.80"
license = "GPL-3.0"

[lib]
name = "akiron_mux_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.10", features = ["tray-icon"] }
tauri-plugin-notification = "2.3.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
zeroize = "1"
tauri-plugin-opener = "2"

[target.'cfg(target_os = "windows")'.dependencies]
window-vibrancy = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
