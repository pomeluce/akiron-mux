[package]
name = "akiron-mux"
version = "1.13.0"
description = "Unified Claude Code and Codex session workspace"
authors = ["AkironMux contributors"]
edition = "2021"
rust-version = "1.80"
license = "GPL-3.0"

[lib]
name = "akiron_mux_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.10", features = [] }
tauri-plugin-notification = "2.3.3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
